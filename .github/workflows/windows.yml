name: Windows

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:

jobs:
  hosted-smoke:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"

      - name: Install package
        run: |
          uv sync --python 3.11 --locked --extra cli --extra gui --extra capture --extra server --extra punctuation

      - name: Compile source
        run: uv run --no-sync python -m compileall src tests scripts

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync python -m unittest discover -s tests

      - name: Runtime report smoke
        run: uv run --no-sync python scripts/runtime_report.py

      - name: PyQt import smoke
        run: uv run --no-sync python -c "from PyQt6.QtWidgets import QApplication; print('PyQt6 import ok')"

      - name: Packaging layout smoke
        shell: pwsh
        run: .\scripts\build_windows_portable.ps1

  self-hosted-rtx-smoke:
    runs-on:
      - self-hosted
      - Windows
      - RTX
    if: ${{ vars.AURA_RUN_WINDOWS_RTX_SMOKE == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"

      - name: Install package
        run: |
          uv sync --python 3.11 --locked --extra cli --extra gui --extra capture --extra server --extra punctuation

      - name: Windows RTX GPU smoke
        run: uv run --no-sync python scripts/windows_gpu_smoke.py

      - name: Windows RTX ASR artifact smoke
        run: uv run --no-sync python scripts/windows_asr_artifact_smoke.py
