[package]
name = "aura-capture"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"

[dependencies]
anyhow = "1"
futures-util = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "io-std", "sync", "signal"] }
tokio-tungstenite = "0.30"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
