settings:
  llm_verification: false
  method: rapidfuzz
  thresholds:
    organizations: 85
    medical_terms: 92
    technical_terms: 90
    people: 90

correction_policy:
  denylist:
    organizations:
      - original: 陽明交大
        corrected: 國立陽明交通大學
        reason: valid_abbreviation_normalization_only
      - original: 智慧財產
        corrected: 智慧財產局
        reason: original_valid_term_adds_institution
      - original: innoVAX
        corrected: InnoVEX
        reason: possible_distinct_entity
      - original: nyc
        corrected: NYCU
        reason: possible_distinct_acronym
    technical_terms:
      - original: detector
        corrected: Detector+
        reason: original_valid_term_adds_product_suffix
  manual_review_required:
    organizations:
      - original: 陽明院
        corrected: 陽明醫院
        reason: context_required
      - original: 信義的院外門診部
        corrected: 信義院外門診部
        reason: context_required
      - original: 個信義院外門診
        corrected: 信義院外門診部
        reason: context_required
    technical_terms:
      - original: 5.0k
        corrected: 510(k)
        reason: regulatory_numeric_context_required
      - original: 50L510K
        corrected: 510(k)
        reason: regulatory_numeric_context_required
    people:
      - original: max
        corrected: Max
        reason: person_name_or_common_word_context_required

