name: CI

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            portaudio19-dev \
            python3-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"

      - name: Install package
        run: |
          uv sync --python 3.12 --locked --extra cli --extra gui --extra capture --extra server --extra punctuation

      - name: Compile source
        run: uv run --no-sync python -m compileall src tests

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: PYTHONPATH=src uv run --no-sync python -m unittest discover -s tests
