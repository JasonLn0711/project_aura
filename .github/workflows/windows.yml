name: Windows

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:

jobs:
  hosted-smoke:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile source
        run: python -m compileall src tests scripts

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests

      - name: Runtime report smoke
        run: python scripts/runtime_report.py

      - name: PyQt import smoke
        run: python -c "from PyQt6.QtWidgets import QApplication; print('PyQt6 import ok')"

      - name: Packaging layout smoke
        shell: pwsh
        run: .\scripts\build_windows_portable.ps1

  self-hosted-rtx-smoke:
    runs-on:
      - self-hosted
      - Windows
      - RTX
    if: ${{ vars.AURA_RUN_WINDOWS_RTX_SMOKE == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[punctuation]"

      - name: Windows RTX GPU smoke
        run: python scripts/windows_gpu_smoke.py

      - name: Windows RTX ASR artifact smoke
        run: python scripts/windows_asr_artifact_smoke.py
